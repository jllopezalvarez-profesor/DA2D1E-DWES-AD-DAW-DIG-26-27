<!DOCTYPE html>
<html lang="es" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Página con datos de nuestra primera aplicación</title>
</head>
<body>
<h1>Página con datos de nuestra primera aplicación</h1>
<p>Estoy en la petición nº <span th:text="${requestNumber}" >Eooooooooo</span>.</p>

<p>Lista de personas</p>
<ul>
    <li th:each="nombre : ${names}" th:text="${nombre}" >Nombre de la persona</li>
</ul>

<p>Esta página se generó a las
    <span title="esto se sustituye"
          th:title="${generatedAt}"
          th:text="${generatedAt}"> tal tal del tal tal (se sustituye)</span></p>

</body>
</html>
