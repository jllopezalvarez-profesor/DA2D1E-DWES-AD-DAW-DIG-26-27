<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularo para generar un mes del calendario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>

<body>
    <div class="container">
        <h1>Formulario para configurr calendario</h1>

        <form method="post" action="ejercicio08.php">

            <div class="mb-3">
                <label for="select-y" class="form-label">Año</label>
                <select class="form-select" id="select-y" name="y" required>
                    <option value="" selected>Seleccione el año</option>
                    <option value="2021">2021</option>
                    <option value="2022">2022</option>
                    <option value="2023">2023</option>
                    <option value="2024">2024</option>
                    <option value="2025">2025</option>
                    <option value="2026">2026</option>
                    <option value="2027">2027</option>
                    <option value="2028">2028</option>
                    <option value="2029">2029</option>
                    <option value="2030">2030</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="select-m" class="form-label">Mes</label>
                <select class="form-select" id="select-m" name="m" required>
                    <option value="">Seleccione el mes</option>
                    <option value="1">Enero</option>
                    <option value="2">Febrero</option>
                    <option value="3" selected>Marzo</option>
                    <option value="4">Abril</option>
                    <option value="5">Mayo</option>
                    <option value="6">Junio</option>
                    <option value="7">Julio</option>
                    <option value="8">Agosto</option>
                    <option value="9">Septiembre</option>
                    <option value="10">Octubre</option>
                    <option value="11">Noviembre</option>
                    <option value="12">Diciembre</option>
                </select>
            </div>


            <button type="submit" class="btn btn-primary">Aceptar</button>

        </form>




    </div>

</body>

</html>
