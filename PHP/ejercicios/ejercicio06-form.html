<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generación de tablas de multiplicar - Formulario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div class="container">
        <h1 class="text-center">Ejercicio 06 - Generación de tablas de multiplicar - Formulario</h1>
        <form action="ejercicio06.php" method="post" novalidate>

            <div class="row">
                <div class="col-lg-6">
                    <div class="mb-3">
                        <label for="input-min" class="form-label">Número menor</label>
                        <input type="number" class="form-control" id="input-min" placeholder="Menor de los dos números"
                            name="min" required>
                    </div>
                </div>
                <div class="col-lg-6">
                    <div class="mb-3">
                        <label for="input-max" class="form-label">Número mayor</label>
                        <input type="text" class="form-control" id="input-max" placeholder="Mayor de los dos números"
                            name="max" required pattern="[0-9]*">
                    </div>
                </div>

            </div>
            <div class="row">
                <div class="col">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" value="VAL" id="checkDefault"
                            name="pruebaCheckBox">
                        <label class="form-check-label" for="checkDefault">
                            Prueba de checkbox
                        </label>
                    </div>
                </div>
            </div>

            <div class="d-grid">



                <button type="submit" class="btn btn-primary">Enviar datos</button>
            </div>

        </form>
    </div>
</body>

</html>
