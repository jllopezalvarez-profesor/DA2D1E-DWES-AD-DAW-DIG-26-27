<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba método POST</title>
</head>
<body>
    <h1>Prueba método POST</h1>
    <form method="post">
        <p><label>Nombre: <input type="text" name="nombre"></label></p>
        <p><label for="campo-apellidos">Apellidos:</label><input type="text" name="apellidos" id="campo-apellidos"></p>

        <p><button type="submit">Enviar el formulario</button> </p>
    </form>
    
</body>
</html>
